{% extends 'base.html' %}
{% block content %}
    {% load static %}
    {% load crispy_forms_tags %}
    <section id="reserve-form" class="container section-bg rounded-3 my-4 p-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-6 mx-auto">
                <h1 class="mb-3 text-center">Reserve a Table</h1>
                <p class="text-center mb-4">
                    Book your table for lunch or dinner. We will confirm availability after
                    submission.
                </p>
                <form method="post">
                    {% csrf_token %}
                    {{ form | crispy }}
                    <button class="btn cta-btn btn-block" type="submit">Submit</button>
                </form>
            </div>
        </div>
    </section>
{% endblock %}
